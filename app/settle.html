<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期末結算 · 陳會計</title>
<style>
  :root{
    --bg:#f4efe7; --card:#fffaf3; --ink:#3d3630; --sub:#8a7f72; --line:#e6dccd;
    --accent:#c8783e; --accent-soft:#f3e2d1; --good:#5a7d5a; --bad:#b4553f;
    --shadow:0 1px 2px rgba(90,70,50,.06),0 8px 24px rgba(90,70,50,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    font-size:15px;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:22px 16px 120px}
  header{text-align:center;margin:6px 0 18px}
  header .badge{display:inline-flex;background:var(--accent-soft);color:var(--accent);
    font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px}
  header h1{font-size:22px;margin:10px 0 4px}
  header p{color:var(--sub);font-size:13px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px;margin:12px 0;box-shadow:var(--shadow)}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:650;
    letter-spacing:.02em}
  /* 2×2 on a phone, one row on a laptop — four flex items in 430px left the fourth
     stranded on its own full-width line, which read as an error rather than a stat. */
  .statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:520px){.statrow{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--bg);border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;text-align:center}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--sub)}
  .stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)}
  .pocket{text-align:center;padding:6px 0 2px}
  .pocket b{display:block;font-size:34px;font-weight:750;letter-spacing:-1px;
    font-variant-numeric:tabular-nums}
  .pocket span{font-size:12.5px;color:var(--sub)}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;background:var(--bg);cursor:pointer}
  label.opt.on{border-color:var(--accent);background:var(--accent-soft)}
  label.opt input{margin:3px 0 0}
  label.opt .t{display:block;font-weight:640;font-size:14px}
  label.opt .d{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px}
  textarea{min-height:62px;resize:vertical}
  .q{margin:12px 0}
  .q .qt{font-size:13.5px;font-weight:620}
  .q.noticed .qt{color:var(--accent)}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
  .last{font-size:12.5px;color:var(--sub);background:var(--bg);border:1px dashed var(--line);
    border-radius:10px;padding:10px 12px;margin-top:10px}
  .backup{font-size:13px}
  .backup.stale{color:var(--bad)}
  .backup a{color:var(--accent);font-weight:640}
  .alloc{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .alloc:last-child{border-bottom:none}
  .alloc .n{flex:1;min-width:0}
  .alloc .n b{display:block;font-size:14px;font-weight:640}
  .alloc .n span{font-size:11.5px;color:var(--sub)}
  .alloc input{width:96px;text-align:right;font:inherit;color:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;
    font-variant-numeric:tabular-nums}
  .left{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;
    padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px}
  .left b{font-size:17px;font-variant-numeric:tabular-nums}
  .left.zero b{color:var(--good)} .left.over b{color:var(--bad)}
  .obj{background:var(--accent-soft);border:1px solid rgba(200,120,62,.3);
    border-radius:12px;padding:12px 14px}
  .obj .t{font-weight:700;font-size:15.5px;color:var(--accent)}
  .obj .w{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6}
  .board{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
  .fund{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:8px;background:var(--bg)}
  .fund .fl{display:flex;gap:8px;align-items:center;font-size:14px}
  .fund .fs{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.55}
  .frow{display:flex;gap:10px;align-items:center;margin-top:8px}
  .frow input[type=range]{flex:1}
  .ftxt{font-size:12px;color:var(--accent);font-weight:640;white-space:nowrap}
  .scored{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
  .scored:last-child{border-bottom:none}
  .scored .v{flex:0 0 auto;font-size:11px;padding:3px 9px;border-radius:999px;
    background:var(--bg);border:1px solid var(--line);color:var(--sub)}
  .scored .v.hit{color:var(--good);border-color:rgba(90,125,90,.45)}
  .scored .v.missed{color:var(--bad);border-color:rgba(180,85,63,.4)}
  .scored .s{flex:1;min-width:0;font-size:13px}
  .scored .s span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;justify-content:center}
  button{font:inherit;font-weight:680;border:none;border-radius:12px;padding:13px 22px;
    background:var(--accent);color:#fff;cursor:pointer;min-width:220px}
  button[disabled]{opacity:.45;cursor:default}
  .done{text-align:center;padding:40px 10px}
  .done h2{font-size:19px;color:var(--good)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card">載入中…</div></div>
<div class="bar" id="bar" style="display:none">
  <button id="go" onclick="submit()">結算，開下一期</button>
</div>
<script>
const el=i=>document.getElementById(i);
const F=n=>'$'+Math.round(n).toLocaleString();
let D=null, dest='quarter', jar='', alloc={}, funds={};

async function load(){
  const r = await fetch('/api/settle'+location.search, {credentials:'same-origin'});
  if(!r.ok){ el('wrap').innerHTML='<div class="card">看不到資料，回去點一次連結。</div>'; return; }
  D = await r.json();
  if(!D.awaiting){ el('wrap').innerHTML =
    '<div class="done"><h2>沒有要結算的期</h2><p>都結算完了，去看看今天還能花多少。</p></div>'; return; }
  render();
  el('bar').style.display='flex';
}

function money(v){ return (v||0).toLocaleString(undefined,{maximumFractionDigits:0}); }

function renderQuarter(){
  const b=D.backup||{}, sp=D.spare||{}, pr=D.proposal||[], ob=D.objective, bd=D.board;
  alloc={}; pr.forEach(p=>alloc[p.id]=p.suggest||0);
  el('wrap').innerHTML = `
    <header>
      <span class="badge">這一季結算</span>
      <h1>${D.label}</h1>
      <p>一季結束了。分配、定下一季的目標，然後開新的一季。</p>
    </header>

    ${bd?`<div class="card">
      <h2>這一季的成績</h2>
      <div class="statrow">
        <div class="stat good"><b>${F(bd.landed||0)}</b><span>已經進帳</span></div>
        <div class="stat"><b>${F(bd.booked||0)}</b><span>接了還沒進</span></div>
        <div class="stat"><b>${F(bd.won_this_season||0)}</b><span>這季自己談下來的</span></div>
        <div class="stat"><b>${bd.days_left||0}</b><span>剩下天數</span></div>
      </div>
      <div class="board">${(bd.tiers||[]).map(t=>
        `<span>${t.name} ${F(t.target||t.need||0)}${t.hit?' ✓':''}</span>`).join('')}</div>
    </div>`:''}

    <div class="card">
      <h2>要分配的錢</h2>
      <div class="pocket"><b>${F(sp.pot||0)}</b>
        <span>這一季每期存下來的季目標存款${sp.water?`　（另外還有 ${F(sp.water)} 是能動的水，先不動它）`:''}</span></div>
      ${pr.length?`<div style="margin-top:10px">${pr.map(p=>`
        <div class="alloc">
          <span class="n"><b>${p.name}</b>
            <span>現在 ${F(p.balance)}${p.target?` / 目標 ${F(p.target)}${p.gap>0?`　還差 ${F(p.gap)}`:'　滿了'}`:'　沒設目標'}</span></span>
          <input type="number" min="0" step="1" id="a_${p.id}" value="${Math.round(p.suggest||0)}"
                 oninput="setAlloc('${p.id}',this.value)">
        </div>`).join('')}
        <div class="left" id="leftRow"><span>還沒分配</span><b id="leftAmt">$0</b></div>
        <div class="hint">分不完也可以——沒分配的就留在季目標罐裡，下一季繼續用。</div>
      </div>`:'<div class="hint">還沒有罐子可以分，先去訓練輪按一次重掃歷史。</div>'}
    </div>

    ${(D.scored&&D.scored.scored&&D.scored.scored.length)?`<div class="card">
      <h2>上一季定的目標，後來呢</h2>
      ${D.scored.scored.map(o=>`<div class="scored">
        <span class="v ${o.verdict}">${{hit:'做到了',partial:'做到一半',missed:'沒做到',unknown:'沒打分數'}[o.verdict]||''}</span>
        <span class="s"><b>${o.text||''}</b><span>${o.detail||''}</span></span></div>`).join('')}
    </div>`:''}

    <div class="card">
      <h2>下一季的目標</h2>
      ${ob?`<div class="obj"><div class="t">${ob.text}</div><div class="w">${ob.why}</div></div>
      <div class="hint">阿姨提的主目標，是照這一期綁住你的原因來的——${
        ob.type==='chase'?'錢卡在別人那，催得動':
        ob.type==='book'?'缺的是工作，排得進行事曆':
        '花得比線兇，收得回來'}。不想用就直接改寫：</div>
      <textarea id="objText">${ob.text}</textarea>`:'<div class="hint">這一季沒有明顯的主目標，自己寫一個：</div><textarea id="objText" placeholder="這一季最想達成的一件事"></textarea>'}

      ${(D.funds||[]).length?`<div style="margin-top:14px">
        <div class="qt">要不要順便把某個罐子當成目標？（次要的）</div>
        <div class="hint">罐子放著不會扣你的錢；設成目標才代表這一季想補到那個程度。</div>
        ${D.funds.map(f=>`
          <div class="fund">
            <label class="fl"><input type="checkbox" id="f_${f.id}" onchange="fundToggle('${f.id}')">
              <b>${f.name}</b></label>
            <div class="fs">現在 ${F(f.balance)} / 目標 ${F(f.target)}（${f.pct_now}%）${
              f.advice?`<br>${f.advice}`:''}</div>
            <div class="frow" id="fr_${f.id}" style="display:none">
              <input type="range" min="10" max="100" step="5" value="${Math.min(100,Math.max(10,Math.round(f.pct_now/5)*5+30))}"
                     id="fp_${f.id}" oninput="fundPct('${f.id}')">
              <span id="ft_${f.id}" class="ftxt"></span>
            </div>
          </div>`).join('')}
      </div>`:''}
    </div>

    <div class="card">
      <h2>回顧一下（可以跳過）</h2>
      ${(D.questions||[]).map(q=>`
        <div class="q"><div class="qt">${q.q}</div>
          <textarea id="r_${q.id}" placeholder="想到什麼寫什麼，沒有也可以空著"></textarea></div>`).join('')}
      ${D.last?`<div class="last"><b>上一次你自己說的（${D.last.label}）</b><br>
        ${Object.values(D.last.answers).filter(Boolean).map(v=>'「'+v+'」').join('<br>')}</div>`:''}
    </div>

    ${backupCard(b)}`;
  el('go').textContent='結算，開新的一季';
  updateLeft();
}

function fundToggle(id){
  const on=el('f_'+id).checked;
  el('fr_'+id).style.display = on?'flex':'none';
  if(on) fundPct(id); else delete funds[id];
}
function fundPct(id){
  const f=(D.funds||[]).find(x=>x.id===id); if(!f) return;
  const pct=parseFloat(el('fp_'+id).value)||0;
  const want=Math.round(f.target*pct/100), add=Math.max(0,want-f.balance);
  el('ft_'+id).textContent=`${pct}%　要再放 ${F(add)}`;
  funds[id]={pct, want, add, name:f.name};
}

function setAlloc(id,v){ alloc[id]=Math.max(0,parseFloat(v)||0); updateLeft(); }

function updateLeft(){
  const pot=(D.spare||{}).pot||0;
  const used=Object.values(alloc).reduce((a,b)=>a+(b||0),0);
  const left=Math.round((pot-used)*100)/100;
  const row=el('leftRow'), amt=el('leftAmt');
  if(!row) return;
  amt.textContent=(left<0?'-':'')+'$'+money(Math.abs(left));
  row.className='left'+(Math.abs(left)<0.5?' zero':(left<0?' over':''));
  el('go').disabled = left < -0.5;
  el('go').textContent = left < -0.5 ? '超過季目標存款了' : '結算，開新的一季';
}

function backupCard(b){
  return `<div class="card">
      <h2>備份</h2>
      <div class="backup ${b.stale?'stale':''}">
        ${b.last?`上次備份：${b.last}（${b.days} 天前）`:'還沒備份過'}${b.stale?'　該備份了':''}
      </div>
      <div class="hint">
        <a href="/api/export" target="_blank">點這裡下載</a>，存到 <b>${b.folder||''}</b><br>
        這個檔案是你全部的帳、商家記憶跟罐子。Railway 上那份不算備份，要有一份在你自己電腦裡。
      </div>
    </div>`;
}

function render(){
  if(D.kind==='quarter'){ renderQuarter(); return; }
  const c=D.closure, pocket=c.pool||0, b=D.backup||{};
  const opts=[
    ['quarter','放進這一季的目標','存起來，累積成這一季自己談下來的成果'],
    ['carry','留著下一期用','不分配，錢留在水裡，下一期的線會鬆一點'],
    ['jar','分進某個罐子','指定一罐——應急、預備金、實驗都可以'],
  ];
  el('wrap').innerHTML = `
    <header>
      <span class="badge">期末結算</span>
      <h1>${D.label}</h1>
      <p>${c.start} ~ ${c.end}　結算完才會開下一期的額度</p>
    </header>

    <div class="card">
      <h2>這一期怎麼過的</h2>
      <div class="statrow">
        <div class="stat good"><b>${c.days_under}</b><span>守住的天數</span></div>
        <div class="stat ${c.days_over?'bad':''}"><b>${c.days_over}</b><span>超過的天數</span></div>
        <div class="stat"><b>${F(c.spent)}</b><span>花掉</span></div>
        <div class="stat"><b>${F(c.line)}</b><span>這期的線</span></div>
      </div>
    </div>

    <div class="card">
      <h2>口袋裡剩下的</h2>
      <div class="pocket"><b>${F(pocket)}</b>
        <span>${pocket>0?'每天沒花完的錢累積起來的——這是你省下來的，不是意外剩的'
                        :'這一期口袋是空的，沒有錢要分配'}</span></div>
      ${pocket>0?`<div class="opts">${opts.map(([v,t,d])=>`
        <label class="opt${dest===v?' on':''}" onclick="pick('${v}')">
          <input type="radio" name="dest" ${dest===v?'checked':''}>
          <span><span class="t">${t}</span><span class="d">${d}</span></span></label>`).join('')}
        </div>
        <select id="jarsel" style="display:${dest==='jar'?'block':'none'}">
          ${(D.jars||[]).filter(j=>j.id!=='tax').map(j=>
            `<option value="${j.id}">${j.name}　${F(j.balance||0)}${j.target?' / '+F(j.target):''}</option>`).join('')}
        </select>`:''}
    </div>

    <div class="card">
      <h2>回顧一下（可以跳過）</h2>
      ${(D.questions||[]).map(q=>`
        <div class="q"><div class="qt">${q.q}</div>
          <textarea id="r_${q.id}" placeholder="想到什麼寫什麼，沒有也可以空著"></textarea></div>`).join('')}
      ${D.noticed?`<div class="q noticed"><div class="qt">${D.noticed}</div>
          <textarea id="r_noticed" placeholder="阿姨從這一期的帳看出來的，隨便聊聊"></textarea></div>`:''}
      ${D.last?`<div class="last"><b>上一次你自己說的（${D.last.label}）</b><br>
        ${Object.values(D.last.answers).filter(Boolean).map(v=>'「'+v+'」').join('<br>')}</div>`:''}
    </div>

    ${backupCard(b)}`;
  const js=el('jarsel'); if(js){ jar=js.value; js.onchange=()=>jar=js.value; }
}

function pick(v){ dest=v; render(); }

async function submit(){
  el('go').disabled=true; el('go').textContent='結算中…';
  const reflection={};
  for(const q of (D.questions||[])){ const t=el('r_'+q.id); if(t&&t.value.trim()) reflection[q.id]=t.value.trim(); }
  const nt=el('r_noticed'); if(nt&&nt.value.trim()) reflection.noticed=nt.value.trim();
  if(D.noticed) reflection.noticed_q=D.noticed;
  let objectives=[];
  const pt=(el('objText')||{}).value;
  if(pt && pt.trim()) objectives.push({...(D.objective||{type:'custom'}), rank:'primary', text:pt.trim()});
  for(const [id,f] of Object.entries(funds)){
    objectives.push({type:'fund', rank:'secondary', jar:id, jar_name:f.name, pct:f.pct,
      target_balance:f.want, add:f.add,
      text:`這一季把「${f.name}」補到 ${f.pct}%（$${f.want.toLocaleString()}）`,
      why:`罐裡已經有 $${f.balance||0}，這一季要再放 $${f.add.toLocaleString()}。`});
  }
  const payload = D.kind==='quarter'
    ? {key:D.key, kind:'quarter', allocations:alloc, reflection, objectives}
    : {key:D.key, destination:dest, jar:jar, reflection};
  const r=await fetch('/api/settle',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  const out=await r.json();
  if(!out.ok){ el('go').disabled=false; el('go').textContent='結算，開下一期';
    alert(out.error||'結算失敗'); return; }
  if(out.still_awaiting && out.still_awaiting.length){ location.reload(); return; }
  el('bar').style.display='none';
  el('wrap').innerHTML=`<div class="done"><h2>${D.kind==='quarter'?'這一季結算好了':'結算好了'}</h2>
    <p>${out.moved?out.moved+'<br>':''}下一期的額度開了，回去看看。</p></div>`;
}
load();
</script>
</body>
</html>
